appId: com.atlas.trading
productName: ATLAS

directories:
  buildResources: assets
  output: out

files:
  - from: dist/main
    to: .
  - from: dist/renderer
    to: renderer
  - from: node_modules
    to: node_modules

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
